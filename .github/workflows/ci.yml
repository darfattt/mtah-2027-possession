name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Skip the [dev] extra: jupyterlab and matplotlib are not needed for tests or lint.
      # Ruff is pinned so a new release cannot change the default rule set under us.
      - name: Install
        run: pip install -e . "pytest>=7" "ruff==0.17.1"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
