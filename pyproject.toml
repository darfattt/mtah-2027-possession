[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtah-possession"
version = "0.1.0"
description = "More Than A Hack 2027 — Phase 1 ball possession pipeline"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "kloppy>=3.15",
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7", "jupyterlab>=4", "ruff>=0.4"]

[project.scripts]
possession = "possession.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
